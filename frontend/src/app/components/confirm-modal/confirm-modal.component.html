@if (visible) {
  <div class="modal-overlay" role="dialog" aria-modal="true" (click)="cancelled.emit()">
    <div class="modal confirm-modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3 style="margin:0;font-size:1rem">{{ title | translate }}</h3>
        <button type="button" class="modal-close" (click)="cancelled.emit()" [attr.aria-label]="'Close' | translate">x</button>
      </div>
      <div class="modal-body">
        <p class="confirm-message">{{ message | translate }}</p>
      </div>
      <div class="modal-footer">
        <button appButton="secondary" buttonSize="md" (click)="cancelled.emit()">{{ 'Cancel' | translate }}</button>
        <button appButton="danger" buttonSize="md" (click)="confirmed.emit()">{{ confirmLabel | translate }}</button>
      </div>
    </div>
  </div>
}
