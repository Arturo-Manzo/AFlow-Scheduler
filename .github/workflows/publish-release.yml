name: publish-release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_SIGNING_ENABLED: ${{ vars.RELEASE_SIGNING_ENABLED || 'false' }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for manual runs)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          }
          else {
            $tag = "${{ github.ref_name }}"
          }

          if (-not $tag) {
            throw "Unable to determine release tag."
          }

          if ($tag.StartsWith("v")) {
            $version = $tag.Substring(1)
          }
          else {
            $version = $tag
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run release smoke gates
        shell: pwsh
        run: |
          $smokeScript = Join-Path $env:GITHUB_WORKSPACE "operations\scripts\release\smoke-gates.ps1"
          if (-not (Test-Path $smokeScript)) {
            throw "Smoke gates script not found at: $smokeScript"
          }
          & $smokeScript -BuildVersion "${{ steps.meta.outputs.version }}"

      - name: Publish backend
        shell: pwsh
        run: |
          dotnet publish CHRONIQ.csproj --configuration Release --no-restore /p:Version=${{ steps.meta.outputs.version }} --output .\artifacts\backend

      - name: Sign backend binaries (best effort)
        id: signing
        shell: pwsh
        env:
          CODE_SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          CODE_SIGNING_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
          CODE_SIGNING_TIMESTAMP_URL: ${{ secrets.CODE_SIGNING_TIMESTAMP_URL }}
        run: |
          $statusPath = ".\artifacts\SIGNING-STATUS.txt"

          if ("${{ env.RELEASE_SIGNING_ENABLED }}" -ne "true") {
            "Signing disabled (RELEASE_SIGNING_ENABLED is false)." | Set-Content -Path $statusPath -Encoding ascii
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            return
          }

          if ((-not $env:CODE_SIGNING_CERT_BASE64) -or (-not $env:CODE_SIGNING_CERT_PASSWORD) -or (-not $env:CODE_SIGNING_TIMESTAMP_URL)) {
            Write-Warning "Signing requested but one or more signing secrets are missing. Release will continue unsigned."
            "Signing requested but skipped: missing one or more required secrets (CODE_SIGNING_CERT_BASE64, CODE_SIGNING_CERT_PASSWORD, CODE_SIGNING_TIMESTAMP_URL)." | Set-Content -Path $statusPath -Encoding ascii
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            return
          }

          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $certPath = Join-Path $env:RUNNER_TEMP "codesign-cert.pfx"

          try {
            [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CODE_SIGNING_CERT_BASE64))

            $binariesToSign = Get-ChildItem -Path .\artifacts\backend -Recurse -File | Where-Object {
              $_.Extension -in @('.exe', '.dll')
            }

            if ($binariesToSign.Count -eq 0) {
              Write-Warning "No backend binaries were found to sign. Release will continue unsigned."
              "Signing requested but skipped: no .exe/.dll files found under artifacts/backend." | Set-Content -Path $statusPath -Encoding ascii
              "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              return
            }

            foreach ($binary in $binariesToSign) {
              & $signtool sign /fd SHA256 /f $certPath /p $env:CODE_SIGNING_CERT_PASSWORD /tr $env:CODE_SIGNING_TIMESTAMP_URL /td SHA256 $binary.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed for $($binary.FullName) with exit code $LASTEXITCODE"
              }
            }

            "Signed backend binaries successfully." | Set-Content -Path $statusPath -Encoding ascii
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          catch {
            Write-Warning "Signing failed: $($_.Exception.Message). Release will continue unsigned."
            "Signing attempted but failed; release continued unsigned. Error: $($_.Exception.Message)" | Set-Content -Path $statusPath -Encoding ascii
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          finally {
            if (Test-Path $certPath) {
              Remove-Item -Path $certPath -Force
            }
          }

      - name: Verify backend signatures (optional)
        if: ${{ steps.signing.outputs.signed == 'true' }}
        shell: pwsh
        run: |
          $binaries = Get-ChildItem -Path .\artifacts\backend -Recurse -File | Where-Object {
            $_.Extension -in @('.exe', '.dll')
          }

          $invalid = @()
          foreach ($binary in $binaries) {
            $signature = Get-AuthenticodeSignature -FilePath $binary.FullName
            if ($signature.Status -ne 'Valid') {
              $invalid += "$($binary.Name): $($signature.Status)"
            }
          }

          if ($invalid.Count -gt 0) {
            throw "Signature verification failed: $($invalid -join '; ')"
          }

      - name: Attach backend config wizard
        shell: pwsh
        run: |
          $backendWizard = Join-Path $env:GITHUB_WORKSPACE "operations\scripts\config\run-config-wizard-backend.ps1"
          if (-not (Test-Path $backendWizard)) {
            throw "Backend config wizard not found: $backendWizard"
          }
          Copy-Item -Path $backendWizard -Destination .\artifacts\backend\run-config-wizard-backend.ps1 -Force

      - name: Attach operations toolkit to backend artifact
        shell: pwsh
        run: |
          $operationsRoot = Join-Path $env:GITHUB_WORKSPACE "operations"
          $databaseRoot = Join-Path $env:GITHUB_WORKSPACE "Database"
          $deploymentTemplatesRoot = Join-Path $env:GITHUB_WORKSPACE "deployment-templates"
          $upgradeManifestPath = Join-Path $env:GITHUB_WORKSPACE "upgrade-manifest.json"
          if (-not (Test-Path $operationsRoot)) {
            throw "Operations folder not found: $operationsRoot"
          }
          if (-not (Test-Path $databaseRoot)) {
            throw "Database folder not found: $databaseRoot"
          }
          if (-not (Test-Path $deploymentTemplatesRoot)) {
            throw "Deployment templates folder not found: $deploymentTemplatesRoot"
          }
          if (-not (Test-Path $upgradeManifestPath)) {
            throw "Upgrade manifest not found: $upgradeManifestPath"
          }

          $backendOperationsPath = ".\artifacts\backend\operations"
          New-Item -ItemType Directory -Path $backendOperationsPath -Force | Out-Null

          Copy-Item -Path (Join-Path $operationsRoot "README.md") -Destination (Join-Path $backendOperationsPath "README.md") -Force
          Copy-Item -Path (Join-Path $operationsRoot "docs") -Destination (Join-Path $backendOperationsPath "docs") -Recurse -Force
          Copy-Item -Path (Join-Path $operationsRoot "scripts") -Destination (Join-Path $backendOperationsPath "scripts") -Recurse -Force
          Copy-Item -Path $databaseRoot -Destination ".\artifacts\backend\Database" -Recurse -Force
          Copy-Item -Path $deploymentTemplatesRoot -Destination ".\artifacts\backend\deployment-templates" -Recurse -Force
          Copy-Item -Path $upgradeManifestPath -Destination ".\artifacts\backend\upgrade-manifest.json" -Force

      - name: Package backend artifact
        shell: pwsh
        run: |
          Compress-Archive -Path .\artifacts\backend\* -DestinationPath .\artifacts\CHRONIQ-backend-${{ steps.meta.outputs.tag }}.zip

      - name: Package frontend artifact
        shell: pwsh
        run: |
          $distPath = Join-Path $env:GITHUB_WORKSPACE "frontend\dist\frontend\browser"
          if (-not (Test-Path $distPath)) {
            throw "Frontend IIS dist folder was not generated: $distPath"
          }

          $frontendWizard = Join-Path $env:GITHUB_WORKSPACE "operations\scripts\config\run-config-wizard-frontend.ps1"
          if (-not (Test-Path $frontendWizard)) {
            throw "Frontend config wizard not found: $frontendWizard"
          }

          $operationsRoot = Join-Path $env:GITHUB_WORKSPACE "operations"
          $deploymentTemplatesRoot = Join-Path $env:GITHUB_WORKSPACE "deployment-templates"
          $upgradeManifestPath = Join-Path $env:GITHUB_WORKSPACE "upgrade-manifest.json"
          if (-not (Test-Path $operationsRoot)) {
            throw "Operations folder not found: $operationsRoot"
          }
          if (-not (Test-Path $deploymentTemplatesRoot)) {
            throw "Deployment templates folder not found: $deploymentTemplatesRoot"
          }
          if (-not (Test-Path $upgradeManifestPath)) {
            throw "Upgrade manifest not found: $upgradeManifestPath"
          }

          $frontendOperationsPath = Join-Path $distPath "operations"
          New-Item -ItemType Directory -Path $frontendOperationsPath -Force | Out-Null

          Copy-Item -Path (Join-Path $operationsRoot "README.md") -Destination (Join-Path $frontendOperationsPath "README.md") -Force
          Copy-Item -Path (Join-Path $operationsRoot "docs") -Destination (Join-Path $frontendOperationsPath "docs") -Recurse -Force
          Copy-Item -Path (Join-Path $operationsRoot "scripts") -Destination (Join-Path $frontendOperationsPath "scripts") -Recurse -Force

          Copy-Item -Path $frontendWizard -Destination (Join-Path $distPath "run-config-wizard-frontend.ps1") -Force
          Copy-Item -Path $deploymentTemplatesRoot -Destination (Join-Path $distPath "deployment-templates") -Recurse -Force
          Copy-Item -Path $upgradeManifestPath -Destination (Join-Path $distPath "upgrade-manifest.json") -Force
          Compress-Archive -Path "$distPath\*" -DestinationPath .\artifacts\CHRONIQ-frontend-${{ steps.meta.outputs.tag }}.zip

      - name: Generate release checksums
        shell: pwsh
        run: |
          $backendZip = ".\artifacts\CHRONIQ-backend-${{ steps.meta.outputs.tag }}.zip"
          $frontendZip = ".\artifacts\CHRONIQ-frontend-${{ steps.meta.outputs.tag }}.zip"
          $checksumPath = ".\artifacts\CHECKSUMS.sha256"

          if (-not (Test-Path $backendZip)) {
            throw "Backend artifact not found: $backendZip"
          }

          if (-not (Test-Path $frontendZip)) {
            throw "Frontend artifact not found: $frontendZip"
          }

          @($backendZip, $frontendZip) | ForEach-Object {
            $hash = (Get-FileHash -Path $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, (Split-Path $_ -Leaf)
          } | Set-Content -Path $checksumPath -Encoding ascii

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/CHRONIQ-backend-${{ steps.meta.outputs.tag }}.zip
            artifacts/CHRONIQ-frontend-${{ steps.meta.outputs.tag }}.zip
            artifacts/CHECKSUMS.sha256
            artifacts/SIGNING-STATUS.txt
